[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyRAMBO"
version = "0.3.0"
description = "A Bayesian Optimization framework for the Machine Learning for Fluid Systems group (ML4F)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Yannick Lecomte" },
    { name = "Miguel A. Mendez" },
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://www.mendezma.com/"
Repository = "https://github.com/mendezVKI/BayesianOptimization_ML4F"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["pyRAMBO", "pyRAMBO.sbo", "pyRAMBO.mfbo", "pyRAMBO.mobo"]

[tool.pytest.ini_options]
# Make `pytest` work from a bare checkout, with no install step and no
# PYTHONPATH, by putting the src/ layout on the path itself. This also means
# the tests always exercise the working tree rather than whatever version
# happens to be installed in the environment.
pythonpath = ["src"]
# Collect only tests/, never the example scripts or legacy/.
testpaths = ["tests"]
